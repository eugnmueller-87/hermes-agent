[build]
builder = "nixpacks"

[deploy]
# Wrap in `sh -c` so ${PORT} is expanded by a shell (the bare startCommand passed
# `$PORT` to uvicorn literally -> "Invalid value for '--port': '$PORT' is not a valid
# integer" and the app never started -> 502). `${PORT:-8080}` also defaults safely if
# Railway hasn't injected PORT yet.
startCommand = "sh -c 'uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}'"
restartPolicyType = "always"
restartPolicyMaxRetries = 5
